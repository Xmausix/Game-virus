[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virus-exe"
version = "0.1.0"
description = "Virus.exe cyberpunk strategy puzzle"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.6,<3",
    "matplotlib>=3.8,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["virus_exe*"]

[project.scripts]
virus-exe = "virus_exe.main:run"
virus-exe-api = "virus_exe.api:run_api"
